name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备固定签名密钥
        run: |
          set -e
          if [ -f ci/keystore.b64 ]; then
            base64 -d ci/keystore.b64 > app/debug.keystore
            echo "使用仓库内的固定密钥"
          else
            mkdir -p ci app
            keytool -genkeypair -v -keystore app/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 12000 \
              -dname "CN=Chat App,O=CQJ,C=CN"
            base64 -w0 app/debug.keystore > ci/keystore.b64
            git config user.name "ci-bot"
            git config user.email "ci-bot@users.noreply.github.com"
            git add ci/keystore.b64
            git commit -m "ci: add fixed signing keystore [skip ci]"
            for i in 1 2 3; do git push && break || sleep 5; done
            echo "已生成并提交固定密钥"
          fi
          keytool -list -v -keystore app/debug.keystore -storepass android 2>/dev/null | grep -E "SHA1:|SHA256:" | head -2

      - name: 缓存 sherpa-onnx AAR
        uses: actions/cache@v4
        with:
          path: app/libs/sherpa-onnx-2.0.2.aar
          key: sherpa-onnx-aar-2.0.2

      - name: 准备 sherpa-onnx AAR
        run: |
          mkdir -p app/libs
          if [ ! -f app/libs/sherpa-onnx-2.0.2.aar ]; then
            curl -sL --max-time 300 -o app/libs/sherpa-onnx-2.0.2.aar \
              "https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.2/sherpa-onnx-2.0.2.aar"
          fi
          ls -l app/libs

      - name: 准备 Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin 2>/dev/null | head -1)"
          export PATH="$SDKM:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$SDKM" >> "$GITHUB_PATH"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 构建 release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: 报告体积
        run: |
          ls -l app/build/outputs/apk/release/
          du -h app/build/outputs/apk/release/app-release.apk

      - name: 发布到 Release（免登录下载）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest \
            --title "latest" \
            --notes "commit ${{ github.sha }}" \
            app/build/outputs/apk/release/app-release.apk

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: chat-apk
          path: app/build/outputs/apk/release/app-release.apk
