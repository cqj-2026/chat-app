name: build

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 探测 sherpa-onnx 模型资产
        continue-on-error: true
        run: |
          for tag in asr-models tts-models; do
            echo "======== $tag ========"
            curl -sL --max-time 180 \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/k2-fsa/sherpa-onnx/releases/tags/$tag" \
              -o "/tmp/$tag.json" || true
            echo "json 字节: $(wc -c < /tmp/$tag.json 2>/dev/null || echo 0)"
            awk '
              /^ *"name": "/ { l=$0; sub(/^ *"name": "/,"",l); sub(/",?[ \t]*$/,"",l); n=l }
              /^ *"size": [0-9]+/ {
                s=$0; gsub(/[^0-9]/,"",s)
                if (n ~ /(zh|aishell|baker|paraformer|zipformer|sense|kokoro|matcha)/ && n ~ /(tar\.bz2|\.onnx)$/)
                  printf "%9.1f MB  %s\n", s/1048576, n
                n=""
              }
            ' "/tmp/$tag.json" | sort -n | head -40
          done
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: 缓存 sherpa-onnx AAR
        uses: actions/cache@v4
        with:
          path: app/libs/sherpa-onnx-2.0.2.aar
          key: sherpa-onnx-aar-2.0.2

      - name: 准备 sherpa-onnx AAR（构建用）
        run: |
          mkdir -p app/libs
          if [ ! -f app/libs/sherpa-onnx-2.0.2.aar ]; then
            curl -sL --max-time 300 -o app/libs/sherpa-onnx-2.0.2.aar \
              "https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.2/sherpa-onnx-2.0.2.aar"
          fi
          ls -l app/libs

      - name: 下载 sherpa-onnx AAR 并导出 API 签名
        continue-on-error: true
        run: |
          AAR=/tmp/sherpa.aar
          curl -sL --max-time 300 -o "$AAR" \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.2/sherpa-onnx-2.0.2.aar" || true
          echo "AAR 字节: $(wc -c < $AAR 2>/dev/null || echo 0)"
          mkdir -p /tmp/aa && cd /tmp/aa && unzip -o -q "$AAR" || true
          echo "=== 顶层 ==="; ls -l
          echo "=== jni 各 ABI 体积 ==="; du -sh jni/* 2>/dev/null
          echo "=== 关键类方法 ==="
          for c in OfflineRecognizerConfig OfflineModelConfig OfflineRecognizerResult OfflineStream FeatureConfig OfflineParaformerModelConfig OfflineZipformerCtcModelConfig OfflineTransducerModelConfig OfflineTtsConfig OfflineTtsModelConfig OfflineTtsVitsModelConfig GeneratedAudio GenerationConfig OfflineRecognizer; do
            echo "---- $c ----"
            javap -p -classpath classes.jar "com.k2fsa.sherpa.onnx.$c" 2>/dev/null | grep -vE "component|copy\$|toString|hashCode|equals" | head -60
          done

      - name: 准备 Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin 2>/dev/null | head -1)"
          export PATH="$SDKM:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$SDKM" >> "$GITHUB_PATH"

      - name: 缓存签名密钥
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: 确保签名密钥存在且固定
        run: |
          KS="$HOME/.android/debug.keystore"
          if [ ! -f "$KS" ]; then
            mkdir -p "$HOME/.android"
            keytool -genkeypair -v -keystore "$KS" \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -v -keystore "$KS" -storepass android 2>/dev/null | grep -E 'SHA1|SHA256' | head -4

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 构建 release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: 报告体积
        run: |
          ls -l app/build/outputs/apk/release/
          du -h app/build/outputs/apk/release/*.apk

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: chat-apk
          path: app/build/outputs/apk/release/app-release.apk
